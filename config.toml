# Configuración del pipeline de Epidex.
# Todas las rutas son relativas a la carpeta de este archivo.

[paths]
raw_dir = "data/raw"                  # descargas (no se suben a git)
collections_dir = "data/collections"  # una colección = un modo de juego
web_data_dir = "web/data"             # salida de build.py, la que lee el navegador
preview_dir = "data/preview"          # vistas previas de depuración (no se suben a git)

[contour]
# Puntos equidistantes en los que se remuestrea cada contorno antes de la DFT.
# Debe ser al menos 2·(máximo de levels)+1 para poder representar esas frecuencias.
n_points = 1024

[puzzle]
# Círculos visibles en cada intento (sin contar el término de frecuencia 0,
# que tras centrar la figura vale 0 y no se ve).
levels = [6, 10, 16, 24, 40, 64]  # 1.º medio difícil (~15 % de error), al 3.º ya se intuye (~6 %)
# Decimales con que se guardan los coeficientes (5 ≈ error de 1e-5 en una figura de radio 1).
decimals = 5
# Los archivos de puzzle se llaman con un hash para que su nombre no revele la
# respuesta. Cambiar la sal cambia todos los nombres.
id_salt = "pokefourier-1"
# Aviso en build.py si con el máximo de círculos el error relativo supera esto.
max_final_error = 0.05

[schedule]
start_date = 2026-11-19   # día del puzzle #1
end_date = 2030-12-31     # último día del calendario (más de 4 años). Amplíalo antes de que llegue
# Pokémon que no salen como Pokémon del día porque su silueta no se reconoce
# (Torkoal: el humo forma parte del contorno; el resto, error > 10 % con 64
# círculos). Siguen siendo respuestas válidas y están en la Pokédex.
exclude = ["324", "668", "804", "851", "937", "979", "994"]
min_gap = 30              # salen todos (al azar) antes de repetir, y nunca antes de 30 días
seed = 20261201           # semilla del azar (cambiarla cambia el orden de los días no jugados)
timezone = "Europe/Madrid"

# Imágenes de origen: arte oficial de la 1.ª generación (repositorio de PokeAPI).
# Ojo: tienen copyright. Sirve para probar la idea, no para publicarla tal cual.
[images]
url_template = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/{n}.png"
first = 1
last = 1025
dir = "data/raw/pokemon"
# Imagen de otra forma cuando la normal no sirve: Palafin (964) en forma Cero tiene
# la misma silueta que Finizen (963), así que se usa la forma Heroica (10256).
overrides = { 964 = 10256 }

# Páginas web (pipeline/site.py): una por idioma a partir de site/page.html.
[site]
name = "Epidex"
url = "https://epidex.pages.dev/"               # dominio con "/" final, p. ej. "https://epidex.app/". Vacío = aún sin dominio
languages = ["en", "es"]  # el primero va en la raíz; el resto en /<idioma>/
template = "site/page.html"
goatcounter = ""          # código de GoatCounter (analítica sin cookies). Vacío = sin analítica
donate_url = "https://ko-fi.com/epidex"           # enlace de donaciones (p. ej. "https://ko-fi.com/usuario"). Vacío = sin «Apoya al creador»

# Aviso legal y privacidad (web/legal/ y web/es/legal/). Rellena owner y email
# antes de publicar: en España la LSSI obliga a identificar al titular de una web
# con anuncios, y es la vía para que un titular de derechos pida retirar algo.
[site.legal]
owner = "Epidex"        # tu nombre (o el de tu empresa)
email = "epidex.dev@gmail.com"        # correo de contacto (retiradas de contenido y protección de datos)
nif = ""            # opcional para un particular; obligatorio si hay actividad económica declarada
address = ""        # opcional
ads = false         # ponlo a true cuando haya anuncios (cambia el texto de privacidad)
updated = "2026-11-24"
